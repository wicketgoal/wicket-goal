<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
    }

    .player {
      width: 100%;
      max-width: 1000px;
      margin: 20px auto;
      background: #000;
    }

    video {
      width: 100%;
      display: block;
      background: #000;
    }
  </style>
</head>

<body>

<div class="player">
  <video id="video" controls playsinline></video>
</div>

<script>
(function () {

  const video = document.getElementById('video');

  const stream =
    'https://mut001.myturn1.top:8088/live/webcricn04/playlist.m3u8?vidictid=207212968921&id=114607&pk=0b637f8b6d8b0cd6a0afcdffad0fde5e9a7e0a71e2502d686ed40d85b2d3deeaa7ce6a8890fa648a7962b064f6f47b30a173d66d65d0e7efd607093662229f62';

  // Safari / iPhone / iPad
  if (video.canPlayType('application/vnd.apple.mpegurl')) {

    video.src = stream;

  }

  // Chrome / Edge / Firefox / Android
  else if (Hls.isSupported()) {

    const hls = new Hls({
      enableWorker: true
    });

    hls.loadSource(stream);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, function () {
      console.log('HLS loaded successfully');
    });

    hls.on(Hls.Events.ERROR, function (event, data) {

      console.log('HLS Error:', data);

      if (data.fatal) {
        switch (data.type) {

          case Hls.ErrorTypes.NETWORK_ERROR:
            console.log('Network error - retrying...');
            hls.startLoad();
            break;

          case Hls.ErrorTypes.MEDIA_ERROR:
            console.log('Media error - recovering...');
            hls.recoverMediaError();
            break;

          default:
            hls.destroy();
            break;
        }
      }
    });

  }

  else {

    alert('This browser does not support HLS.');

  }

})();
</script>

</body>
</html>
