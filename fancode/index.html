
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
                 maximum-scale=1.0, user-scalable=no">

  <title>Live Player</title>

  <!-- Shaka Player -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.16.3/shaka-player.compiled.min.js"></script>

  <style>
    /* =========================
       RESET
    ========================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }


    /* =========================
       PLAYER WRAPPER
    ========================= */

    #player-container {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      background: #000;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }


    /* =========================
       VIDEO
    ========================= */

    #video {
      width: 100%;
      height: 100%;

      object-fit: contain;

      background: #000;

      display: block;
    }


    /* =========================
       LOADING SCREEN
    ========================= */

    #loading {
      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      z-index: 20;

      text-align: center;

      color: #fff;

      pointer-events: none;
    }

    .spinner {
      width: 48px;
      height: 48px;

      border: 4px solid rgba(255,255,255,0.25);
      border-top-color: #fff;

      border-radius: 50%;

      animation: spin 0.8s linear infinite;

      margin: 0 auto 15px;
    }

    #loading-text {
      font-size: 14px;
      opacity: 0.85;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }


    /* =========================
       ERROR SCREEN
    ========================= */

    #error-screen {
      position: absolute;

      inset: 0;

      z-index: 30;

      display: none;

      align-items: center;
      justify-content: center;

      flex-direction: column;

      text-align: center;

      background: #000;

      padding: 25px;
    }

    #error-screen h2 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    #error-message {
      color: #aaa;
      font-size: 14px;
      max-width: 500px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    #retry-button {
      border: 0;

      background: #1597ff;

      color: #fff;

      padding: 11px 22px;

      border-radius: 5px;

      cursor: pointer;

      font-size: 14px;
    }

    #retry-button:hover {
      opacity: 0.85;
    }


    /* =========================
       LIVE BADGE
    ========================= */

    #live-badge {
      position: absolute;

      top: 18px;
      left: 18px;

      z-index: 15;

      background: rgba(0,0,0,0.65);

      padding: 6px 10px;

      border-radius: 4px;

      font-size: 12px;

      color: #fff;

      display: none;

      align-items: center;

      gap: 6px;
    }

    .live-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #ff3030;

      box-shadow: 0 0 8px rgba(255,48,48,0.8);
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      #live-badge {
        top: 10px;
        left: 10px;

        font-size: 11px;
      }

      #loading-text {
        font-size: 13px;
      }

    }

  </style>
</head>


<body>


<div id="player-container">

  <!-- Video -->
  <video
    id="video"
    playsinline
    webkit-playsinline
    controls
    preload="auto"
    crossorigin="anonymous">
  </video>


  <!-- Loading -->
  <div id="loading">

    <div class="spinner"></div>

    <div id="loading-text">
      Loading live stream...
    </div>

  </div>


  <!-- Live badge -->
  <div id="live-badge">

    <span class="live-dot"></span>

    <span>LIVE</span>

  </div>


  <!-- Error -->
  <div id="error-screen">

    <h2>Stream unavailable</h2>

    <div id="error-message">
      The stream could not be loaded.
    </div>

    <button id="retry-button">
      Retry
    </button>

  </div>

</div>



<script>

/* =========================================================
   HORA TV / DASH PLAYER
========================================================= */


/* =========================
   STREAM
========================= */

const STREAM_URL =
  'https://otte.cache.aiv-cdn.net/iad-nitro/live/clients/dash/enc/b3b3fkmrbl/out/v1/1084d5c9a97a4c5b9f9554c88f486646/cenc.mpd';


/* =========================
   CLEAR KEY
========================= */

const KEY_ID =
  '82dfca238e8c4b430a3269db71965db9';

const KEY =
  'a00b28caf4ac628e77a553d440c0ddca';


/* =========================
   ELEMENTS
========================= */

const video =
  document.getElementById('video');

const loading =
  document.getElementById('loading');

const loadingText =
  document.getElementById('loading-text');

const errorScreen =
  document.getElementById('error-screen');

const errorMessage =
  document.getElementById('error-message');

const retryButton =
  document.getElementById('retry-button');

const liveBadge =
  document.getElementById('live-badge');


/* =========================
   PLAYER
========================= */

let player = null;


/* =========================
   RETRY CONTROL
========================= */

let retryCount = 0;

const MAX_RETRIES = 5;


/* =========================================================
   WAIT
========================================================= */

function wait(ms) {

  return new Promise(function(resolve) {

    setTimeout(resolve, ms);

  });

}


/* =========================================================
   SHOW ERROR
========================================================= */

function showError(message) {

  loading.style.display = 'none';

  errorScreen.style.display = 'flex';

  errorMessage.textContent =
    message || 'Unable to play this stream.';

}


/* =========================================================
   HIDE ERROR
========================================================= */

function hideError() {

  errorScreen.style.display = 'none';

}


/* =========================================================
   LOAD PLAYER
========================================================= */

async function loadPlayer() {

  hideError();

  loading.style.display = 'block';

  loadingText.textContent =
    'Loading live stream...';


  /* Browser support */

  if (!shaka.Player.isBrowserSupported()) {

    showError(
      'Your browser does not support this video player.'
    );

    return;

  }


  /* Destroy previous player */

  if (player) {

    try {

      await player.destroy();

    } catch (e) {

      console.warn(e);

    }

    player = null;

  }


  /* Create Shaka */

  player = new shaka.Player(video);


  /* =====================================================
     DRM / CLEAR KEY
  ===================================================== */

  player.configure({

    drm: {

      clearKeys: {

        [KEY_ID]: KEY

      }

    },


    /* ===================================================
       BUFFERING
    =================================================== */

    streaming: {

      bufferingGoal: 30,

      rebufferingGoal: 3,

      bufferBehind: 30,

      retryParameters: {

        maxAttempts: 5,

        baseDelay: 1000,

        backoffFactor: 2,

        fuzzFactor: 0.5,

        timeout: 15000

      },

      stallEnabled: true,

      stallThreshold: 1

    },


    /* ===================================================
       MANIFEST
    =================================================== */

    manifest: {

      retryParameters: {

        maxAttempts: 5,

        baseDelay: 1000,

        backoffFactor: 2,

        fuzzFactor: 0.5,

        timeout: 15000

      }

    }

  });


  /* =====================================================
     ERROR EVENT
  ===================================================== */

  player.addEventListener(
    'error',
    function(event) {

      console.error(
        'Shaka error:',
        event.detail
      );

      handlePlayerError(
        event.detail
      );

    }
  );


  /* =====================================================
     BUFFERING EVENT
  ===================================================== */

  player.addEventListener(
    'buffering',
    function(event) {

      if (event.buffering) {

        loading.style.display = 'block';

        loadingText.textContent =
          'Buffering...';

      } else {

        loading.style.display = 'none';

      }

    }
  );


  /* =====================================================
     STREAM LOADING
  ===================================================== */

  try {

    loadingText.textContent =
      'Connecting to stream...';


    await player.load(
      STREAM_URL
    );


    console.log(
      'Stream loaded successfully.'
    );


    retryCount = 0;


    loading.style.display = 'none';


    liveBadge.style.display =
      'flex';


    /* =================================================
       AUTOPLAY
    ================================================= */

    try {

      video.muted = true;

      await video.play();

    } catch (autoplayError) {

      console.log(
        'Autoplay blocked by browser.'
      );

      /*
        Controls remain available.
        User can press Play manually.
      */

    }


  } catch (error) {

    console.error(
      'Player load error:',
      error
    );


    handlePlayerError(error);

  }

}


/* =========================================================
   ERROR HANDLER
========================================================= */

async function handlePlayerError(error) {

  loading.style.display = 'none';

  liveBadge.style.display = 'none';


  /*
    Automatically retry temporary errors.
  */

  if (retryCount < MAX_RETRIES) {

    retryCount++;


    loading.style.display = 'block';

    loadingText.textContent =
      'Connection lost. Retrying...';


    const delay =
      Math.min(
        1000 * Math.pow(2, retryCount - 1),
        10000
      );


    await wait(delay);


    loadPlayer();

    return;

  }


  let message =
    'Unable to load the stream.';


  if (error && error.code) {

    message =
      'Player error code: ' +
      error.code;

  }


  showError(message);

}


/* =========================================================
   RETRY BUTTON
========================================================= */

retryButton.addEventListener(
  'click',
  function() {

    retryCount = 0;

    loadPlayer();

  }
);


/* =========================================================
   VIDEO ERROR RECOVERY
========================================================= */

video.addEventListener(
  'error',
  function() {

    console.warn(
      'HTML5 video error.'
    );

  }
);


/* =========================================================
   PAGE VISIBILITY
========================================================= */

document.addEventListener(
  'visibilitychange',
  function() {

    /*
      Do not destroy the player when the
      phone screen is locked or browser tab
      becomes hidden.

      The browser decides playback behavior.
    */

    if (
      document.visibilityState === 'visible' &&
      video.paused
    ) {

      /*
        Don't force autoplay here.
        Mobile browsers may block it.
      */

    }

  }
);


/* =========================================================
   START
========================================================= */

document.addEventListener(
  'DOMContentLoaded',
  function() {

    loadPlayer();

  }
);

</script>

</body>
</html>
