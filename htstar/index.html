<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Live Player</title>
<script src="https://cdn.jwplayer.com/libraries/SAHhwvZq.js"></script>
<style>
html,body{
margin:0;
padding:0;
background:#000;
width:100vw;
height:100dvh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
}
#player{
width:100vw;
height:100dvh;
max-width:100%;
max-height:100%;
position:relative;
}
.jw-icon-aspect{
background-size:contain;
}
:root{
--logo-top:20px;
--logo-left:20px;
--logo-size:90px;
}
.player-logo{
position:absolute;
top:var(--logo-top);
left:var(--logo-left);
width:var(--logo-size);
height:auto;
z-index:999999;
pointer-events:none;
}
@media (max-width:768px){
:root{
--logo-size:60px;
}
}
</style>
</head>
<body>
<div id="player"></div>

<script>
// Get channel ID from URL parameter
const urlParams = new URLSearchParams(window.location.search);
const channelId = urlParams.get('id');

if (!channelId) {
    document.body.innerHTML = '<h2 style="color:white;text-align:center;margin-top:50px;">Channel ID Missing (use ?id=sony-hd)</h2>';
    throw new Error("Channel ID Missing");
}

// Fetch JSON from server side
fetch('https://allinonereborn2.online/sony/sliv3.json')
    .then(response => {
        if (!response.ok) {
            throw new Error('Failed to fetch channel data');
        }
        return response.json();
    })
    .then(data => {
        if (!data[channelId] || !data[channelId].m3u8) {
            document.body.innerHTML = '<h2 style="color:white;text-align:center;margin-top:50px;">Channel or m3u8 link not found</h2>';
            return;
        }

        const channelData = data[channelId];
        const originalM3u8 = channelData.m3u8;
        const proxyUrl = "https://allinonereborn2.online/livtest3/stream_proxy.php?url=" + encodeURIComponent(originalM3u8);

        // Set page title
        document.title = 'Live Player - ' + (channelData.title || 'Player');

        // Initialize player
        initializePlayer(proxyUrl);
    })
    .catch(error => {
        document.body.innerHTML = '<h2 style="color:white;text-align:center;margin-top:50px;">Failed to fetch channel data</h2>';
        console.error(error);
    });

function initializePlayer(videoUrl) {
    if(!videoUrl || videoUrl === ''){
        document.body.innerHTML="<h2 style='color:white'>Stream URL Missing</h2>";
        throw new Error("No stream URL");
    }

    // PC Browser Detection
    const isPC = !/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) && (window.innerWidth > 1024 || !('ontouchstart' in window));

    const player = jwplayer("player");

    player.setup({
        file: videoUrl,
        width:"100%",
        height:"100%",
        autostart:true,
        mute:false,
        primary:"html5",
        stretching:"uniform",
        controls:true,
        qualityLabels:false
    });

    // aspect modes for mobile
    const modes = ["uniform","exactfit","fill"];
    let modeIndex = 0;

    // zoom levels for PC
    const zoomLevels = [1, 1.25, 1.3, 1.4];
    let zoomIndex = 0;

    // add button
    player.on('ready',function(){
        if(isPC) {
            // For PC - Video zoom in/out
            player.addButton(
                "https://i.ibb.co/4wPT214r/frame.png",
                "Zoom Level",
                function(){
                    zoomIndex++;
                    if(zoomIndex >= zoomLevels.length){
                        zoomIndex = 0;
                    }
                    const videoContainer = document.querySelector('.jw-video, .jw-media');
                    if(videoContainer) {
                        videoContainer.style.transform = 'scale(' + zoomLevels[zoomIndex] + ')';
                        videoContainer.style.transformOrigin = 'center center';
                    }
                },
                "aspect-button"
            );
        } else {
            // For Mobile - Aspect ratio functionality
            player.addButton(
                "https://i.ibb.co/4wPT214r/frame.png",
                "Aspect Ratio",
                function(){
                    modeIndex++;
                    if(modeIndex >= modes.length){
                        modeIndex = 0;
                    }
                    player.setConfig({
                        stretching: modes[modeIndex]
                    });
                },
                "aspect-button"
            );
        }

        // ADD LOGO INSIDE PLAYER
        const logo = document.createElement("img");
        logo.src="https://allinonereborn2.online/logo/allinonet.jpg";
        logo.className="player-logo";
        document.getElementById("player").appendChild(logo);
    });
}
</script>
</body>
</html>
