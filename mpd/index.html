<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Stream Player Fullscreen</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  .shaka-video-container {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .shaka-spinner-container,
.shaka-spinner,
.shaka-spinner-svg {
    display: none !important;
    visibility: hidden !important;
    opacity: 0 !important;
}


  video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }

  /* LIVE Banner */
  .live-banner {
    position: absolute;
    top: 20px;
    right: 80px;
    z-index: 10;
    background: red;
    color: white;
    padding: 8px 16px;
    font-weight: bold;
    font-size: 16px;
    border-radius: 4px;
    text-transform: uppercase;
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%,100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.1); opacity: 0.8; }
  }

  /* Logo */
  .logo {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 10;
    height: 60px;
  }

   /* Bottom-center overlay text (slightly higher) */
  #overlay-text {
    position: absolute;
    bottom: 60px; /* moved higher */
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: 22px;
    font-weight: 700;
    text-shadow: 2px 2px 6px rgba(0,0,0,0.8);
    z-index: 10;
    pointer-events: none;
    font-family: 'Roboto', sans-serif;
  } /* Bottom-center overlay text */
  #overlay-text {
    position: absolute;
    bottom: 5%;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.7);
    font-size: 1.2vw;
    min-font-size: 12px;
    max-font-size: 20px;
    font-weight: 600;
    text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
    z-index: 10;
    pointer-events: none;
    font-family: 'Roboto', sans-serif;
  }

  @media (max-width: 600px) {
    #overlay-text {
      font-size: 14px;
      bottom: 8%;
    }
  }
</style>
</head>

  
<body>

<!-- Logo -->
<img  src="" alt="Logo">

<!-- LIVE Banner -->
<div class=""></div>

<!-- Shaka Player Video Container -->
<div class="shaka-video-container" data-shaka-player>
  <video autoplay playsinline preload="metadata" poster="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiY2GxBTWne2pqm3JvFOe2lRIjMmlPsyQXjC468bbnVC2sy_aB0iI_5gvjaNIl0Gul8xWRLzOkTGs4_p7HUMpX0zzBnGTEkSbYWfBQDNEwDtEpG1z94CuM6vlcCh7jR5fcGv3pUIZ5hCb0ptrMK4N-W1XERy5bsDw8Q4DUPrMU7rxq0TMuodyjcRkfh2z0/w400-h225/images%20(1).jpeg"></video>
</div>
<div id="overlay-text"></div>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  shaka.polyfill.installAll();

  if (!shaka.Player.isBrowserSupported()) {
    alert('Your browser does not support Shaka Player.');
    return;
  }

  const video = document.querySelector('video');
  const player = new shaka.Player(video);

  const container = document.querySelector('.shaka-video-container');
  const ui = new shaka.ui.Overlay(player, container, video);

  ui.configure({
    controlPanelElements: [
      'play_pause', 'time_and_duration', 'mute', 'volume',
      'spacer', 'quality', 'fullscreen'
    ]
  });

  // Define multiple streams with their keys
  const streams = {
    "1": {
      url: "https://otte.cache.aiv-cdn.net/bom-nitro/live/clients/dash/enc/dev1hjwzh9/out/v1/a5f0ee7ad7b24906b14f43bebbbe4678/cenc.mpd",
      keyId: "cc91508324ce9dcaf425a43d58f1d9d4",
      key: "643e5474d9edd87c7d9091c8c97994ca"
    },
    "2": {
      url: "https://otte.cache.aiv-cdn.net/iad-nitro/live/clients/dash/enc/b3b3fkmrbl/out/v1/1084d5c9a97a4c5b9f9554c88f486646/cenc.mpd",
      keyId: "82dfca238e8c4b430a3269db71965db9",
      key: "a00b28caf4ac628e77a553d440c0ddca"
    },
    "3": {
      url: "https://otte.live.fly.ww.aiv-cdn.net/syd-nitro/live/dash/enc/pnes4dv2ag/out/v1/e21d21ec21e34c7192049a44ee3de428/cenc.mpd",
      keyId: "ed76c18710d621a87c89dedc7c13019f",
      key: "7241c82fe48525a9dc6be6d7bb86611f"
    },
    "dh": { 
      url: "https://ottlive.dishhome.com.np/protected/vVnVkZ4Bnu3lGwDQJxH-/dash/manifest.mpd",
      keyId: "2bb7f4489e5f421eb0de90035cffb2bc",
      key: "96b09b69c638dac184f42910e0095933"
    },
    "willow": { 
      url: "https://a96aivottlinear-a.akamaihd.net/OTTB/pdx-nitro/live/clients/dash/enc/myvotpnueo/out/v1/31f5a50cbd8041308c560355044e0b03/cenc.mpd",
      keyId: "91ffd985da527c7d77ecc801128d11cc",
      key: "3bb5d51b2fef3b50c43d0cc12455eaf7"
    },

  "sony": { 
      url: "https://abn7ylpaaaaaaaame77ehqq2geew7.ta.bia-cf.live.pv-cdn.net/bom-nitro/live/clients/dash/enc/2crmhngewx/out/v1/7005e762d047462aa11136773a136dfa/cenc.mpd",
      keyId: "ebc640cb03dbdf8677190f7e4b2e96b0",
      key: "7ab2c0204d41d1eefeca0cc04622c4cc"
    },

    "npl": { 
      url: "https://ott-edge-mtdc04.nettv.com.np/npl/live_match3/index.mpd",
      keyId: "b4d7fc89103597185058cc4c81a1800d",
      key: "17062472ba2a3f1db709d3bb7761c936"
    },

    "eurosprot": { 
      url: "https://wbd.skandha.tv/EuroSport/EuroSport.isml/.mpd",
      keyId: "12ed56d780abcfebcd23aa27e4ac5014",
      key: "6784567890abcfebcd23aa27e4ac2813"
    }
  };

  // Get ?id= parameter from the URL (e.g. ?id=2)
  const urlParams = new URLSearchParams(window.location.search);
  const id = urlParams.get('id') || "1"; // default to 1

  const stream = streams[id];
  if (!stream) {
    alert("Invalid stream ID");
    return;
  }

  // Configure DRM dynamically
  player.configure({
    drm: {
      clearKeys: {
        [stream.keyId]: stream.key
      }
    },
    streaming: {
      lowLatencyMode: true
    }
  });

  // Load selected stream
  try {
    await player.load(stream.url);
    console.log("✅ Loaded stream ID:", id);
  } catch (error) {
    console.error("❌ Failed to load stream:", error);
    alert("Failed to load the selected live stream.");
  }
});
</script>

</body>
</html>
